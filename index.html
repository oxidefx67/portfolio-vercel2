<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Montserrat:wght@300;500;700&display=swap">
<title>Video Editor Portfolio (Fuji)</title>
<style>
/* Gotham: put Gotham-Light, Gotham-Medium, Gotham-Bold (.woff2/.woff/.otf/.ttf) in a /fonts folder next to this file. Montserrat is the fallback so phones never drop to a system/CJK font. */
@font-face{font-family:"Gotham";font-weight:300;font-style:normal;src:local("Gotham Light"),local("Gotham-Light"),local("Gotham Book"),local("Gotham-Book"),url("fonts/Gotham-Light.woff2") format("woff2"),url("fonts/Gotham-Light.woff") format("woff"),url("fonts/Gotham-Light.otf") format("opentype"),url("fonts/Gotham-Light.ttf") format("truetype");font-display:swap}
@font-face{font-family:"Gotham";font-weight:500;font-style:normal;src:local("Gotham Medium"),local("Gotham-Medium"),url("fonts/Gotham-Medium.woff2") format("woff2"),url("fonts/Gotham-Medium.woff") format("woff"),url("fonts/Gotham-Medium.otf") format("opentype"),url("fonts/Gotham-Medium.ttf") format("truetype");font-display:swap}
:root{--bg:#03050b;--blue:#2f7bff;--blue2:#0a3cff;--ice:#9cc4ff;--mute:#8d9bbd;--font:"Gotham","Montserrat","Helvetica Neue",Arial,sans-serif;--display:"Bricolage Grotesque","Montserrat","Arial Black",Arial,sans-serif}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{font-family:var(--font);font-weight:300;color:#fff;background:var(--bg);line-height:1.55;overflow-x:hidden;padding-top:env(safe-area-inset-top)}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(50vmax 40vmax at 8% 0,rgba(47,123,255,.38) 0,transparent 60%),radial-gradient(45vmax 40vmax at 100% 30%,rgba(10,60,255,.28) 0,transparent 60%),radial-gradient(50vmax 40vmax at 30% 100%,rgba(47,123,255,.2) 0,transparent 60%)}
h1,h2,b,strong,.btn,.tabs button{font-weight:500}
.glass{background:linear-gradient(135deg,rgba(255,255,255,.11),rgba(255,255,255,.03));backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(255,255,255,.04),0 14px 44px rgba(0,0,0,.5)}
nav{position:sticky;top:max(10px,env(safe-area-inset-top));z-index:20;margin:10px auto 0;width:min(1100px,calc(100% - 24px));display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px 8px 14px;border-radius:999px}
.brand{display:flex;align-items:center;gap:10px;font-weight:500;color:#fff;text-decoration:none}
.brand img{height:34px;display:block}
.fb{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--blue2),var(--blue));display:grid;place-items:center;font-weight:500}
.links{display:none;gap:2px}
@media(min-width:900px){.links{display:flex}}
.links a{color:#fff;text-decoration:none;font-size:.86rem;padding:7px 12px;border-radius:999px;transition:background .25s}
.links a:hover{background:rgba(47,123,255,.25)}
.wrap{max-width:1100px;margin:auto;padding:0 20px}
.banner{margin:22px auto 0;width:min(720px,calc(100% - 24px))}
.banner video{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:28px;display:block;pointer-events:none;background:linear-gradient(120deg,var(--blue2),#06122f)}
#home{text-align:center;padding:46px 20px 10px;display:flex;flex-direction:column;align-items:center;gap:20px}
.stage{position:relative;width:min(1000px,100%);padding:20px 0}
h1{font-size:clamp(2.6rem,9vw,6rem);line-height:1.02;letter-spacing:-.03em;background:linear-gradient(90deg,#fff 10%,var(--ice) 50%,var(--blue) 95%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:url(#liquid);padding:6px 0;cursor:default}
h2{font-size:clamp(1.6rem,4vw,2.4rem);letter-spacing:-.01em}
.sub{color:var(--mute);max-width:52ch}
.fls{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:14px}
.fl{padding:12px 20px;border-radius:22px;text-align:center;animation:float 5s ease-in-out infinite}
.fl b{display:block;font-size:1.5rem;color:var(--ice)}
.fl span{font-size:.78rem;color:var(--mute)}
@keyframes float{50%{transform:translateY(-12px)}}
@media(min-width:900px){.fls{position:absolute;inset:0;margin:0;pointer-events:none;display:block}.fl{position:absolute}.fl:nth-child(1){left:0;top:-14%}.fl:nth-child(2){right:0;top:4%;animation-delay:-1.5s}.fl:nth-child(3){left:6%;bottom:-16%;animation-delay:-3s}.fl:nth-child(4){right:8%;bottom:-12%;animation-delay:-4s}}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{display:inline-block;padding:12px 26px;border-radius:999px;font:inherit;font-weight:500;font-size:.92rem;text-decoration:none;border:0;cursor:pointer;color:#fff;transition:transform .25s,box-shadow .25s}
.btn:hover{transform:translateY(-2px)}
.btn.dark{background:linear-gradient(180deg,#4d8dff,var(--blue2));box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 10px 30px rgba(47,123,255,.45)}
.btn.light{background:rgba(255,255,255,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.btn.sm{padding:9px 18px;font-size:.85rem}
.tools{display:flex;gap:22px;flex-wrap:wrap;justify-content:center;color:var(--mute);font-size:.92rem}
.tools i{font-style:normal;display:inline-grid;place-items:center;width:36px;height:36px;border-radius:10px;background:rgba(47,123,255,.16);color:var(--ice);font-weight:500;font-size:.9rem;margin-right:8px;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
section.s{padding:80px 0 10px;text-align:center}
.s .sub{margin:8px auto 0}
.cards{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-top:28px;text-align:left}
.pad{padding:22px;border-radius:26px}
.ch{text-align:center;color:#fff;text-decoration:none;display:block;position:relative;overflow:hidden;transition:transform .35s,box-shadow .35s;padding-bottom:40px}
.ch:hover,.ch.armed{transform:translateY(-8px);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 20px 50px rgba(47,123,255,.4)}
.ch .av{width:76px;height:76px;border-radius:50%;margin:0 auto 12px;background:linear-gradient(135deg,var(--blue2),var(--blue));overflow:hidden;transition:box-shadow .35s}
.ch:hover .av,.ch.armed .av{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--blue)}
.ch img{width:100%;height:100%;object-fit:cover;display:block}
.ch small{color:var(--mute)}
.ch em{position:absolute;left:0;right:0;bottom:0;padding:10px;font-style:normal;font-size:.78rem;color:#fff;background:rgba(47,123,255,.85);transform:translateY(100%);transition:transform .3s}
.ch em::after{content:attr(data-h)}
.ch:hover em,.ch.armed em{transform:none}
@media(hover:none){.ch em::after{content:attr(data-t)}}
.tabs{display:inline-flex;position:relative;padding:5px;border-radius:999px;margin:22px 0 28px}
.tabs button{position:relative;z-index:1;flex:1;min-width:130px;border:0;background:none;color:#fff;font:inherit;font-weight:500;font-size:.9rem;padding:10px 22px;border-radius:999px;cursor:pointer;transition:color .3s}
.ind{position:absolute;top:5px;bottom:5px;left:5px;width:calc((100% - 10px)/2);border-radius:999px;background:linear-gradient(180deg,#4d8dff,var(--blue2));box-shadow:0 6px 20px rgba(47,123,255,.5);transition:transform .45s cubic-bezier(.3,1.35,.5,1)}
.tabs.long .ind{transform:translateX(100%)}
.grid{display:grid;gap:16px;justify-content:center;transition:opacity .26s,transform .26s}
.grid.out{opacity:0;transform:translateX(calc(var(--dx,24px)*-1))}
.grid.pre{opacity:0;transform:translateX(var(--dx,24px))}
.grid.short{grid-template-columns:repeat(auto-fill,minmax(150px,200px))}
.grid.long{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.card{border:0;padding:0;cursor:pointer;color:#fff;text-align:left;font:inherit;background:none;animation:rise .55s both;animation-delay:calc(var(--i)*70ms)}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.97)}}
.thumb{border-radius:24px;overflow:hidden;position:relative;background:linear-gradient(160deg,#06122f,var(--blue2) 70%,var(--blue));box-shadow:0 14px 34px rgba(0,0,0,.5);transition:transform .4s cubic-bezier(.2,.8,.2,1),box-shadow .4s}
.short .thumb{aspect-ratio:9/16}.long .thumb{aspect-ratio:16/9}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s}
.card:hover .thumb{transform:translateY(-8px) scale(1.04);box-shadow:0 0 0 2px var(--blue),0 24px 60px rgba(47,123,255,.55)}
.card:hover .thumb img,.card:hover .thumb video{transform:scale(1.08)}
.play{position:absolute;inset:0;display:grid;place-items:center;font-size:1.6rem;text-shadow:0 2px 12px #0008;transition:transform .3s,opacity .3s}
.card:hover .play{transform:scale(1.35);opacity:.9}
.cap{position:absolute;left:0;right:0;bottom:0;padding:30px 14px 12px;font-size:.88rem;background:linear-gradient(transparent,rgba(2,6,20,.85));transform:translateY(8px);transition:transform .35s}
.card:hover .cap{transform:none}
.res{transition:transform .35s,box-shadow .35s}
.res:hover{transform:translateY(-6px);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 18px 44px rgba(47,123,255,.35)}
.res b{font-size:2.6rem;color:var(--ice);letter-spacing:-.02em;display:block}
.res p{color:var(--mute)}
.rate{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:26px 0 18px}
.rate div{padding:14px 26px;border-radius:22px}
.rate b{display:block;font-size:1.8rem;color:var(--ice)}
.rate span{font-size:.8rem;color:var(--mute)}
.rv{max-width:720px;margin:0 auto;padding:30px 26px;border-radius:30px;text-align:center;min-height:190px;transition:opacity .3s,transform .3s}
.rv.sw{opacity:0;transform:translateY(10px)}
.rv q{display:block;font-size:1.15rem;quotes:none;margin-bottom:18px}
.who{display:flex;align-items:center;justify-content:center;gap:12px;text-align:left}
.who small{color:var(--mute);display:block}
.star{color:#ffc94d;letter-spacing:2px;margin-bottom:10px}
.avs{display:flex;gap:10px;justify-content:center;margin:20px 0 6px;flex-wrap:wrap}
.avs button{width:48px;height:48px;border-radius:50%;border:0;padding:0;overflow:hidden;background:linear-gradient(135deg,var(--blue2),var(--blue));color:#fff;font:inherit;font-weight:500;cursor:pointer;opacity:.5;transition:opacity .3s,transform .3s,box-shadow .3s}
.avs button.on,.avs button:hover{opacity:1;transform:scale(1.12);box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--blue)}
.avs img,.who img{width:100%;height:100%;object-fit:cover;display:block}
.who .pf{width:44px;height:44px;border-radius:50%;overflow:hidden;background:linear-gradient(135deg,var(--blue2),var(--blue));display:grid;place-items:center;flex:none}
.cnt{color:var(--mute);font-size:.85rem}
.modal{position:fixed;inset:0;z-index:50;display:none;place-items:center;background:rgba(1,3,12,.8);backdrop-filter:blur(10px);padding:16px}
.modal.open{display:grid}
.box{width:min(92vw,960px);position:relative}
.box.vert{width:min(80vw,360px)}
.box iframe,.box video{width:100%;aspect-ratio:16/9;border:0;border-radius:20px;display:block;background:#000}
.box.vert iframe,.box.vert video{aspect-ratio:9/16;max-height:80svh}
.x{position:absolute;top:-16px;right:-6px;width:38px;height:38px;border-radius:50%;border:0;font-size:1rem;cursor:pointer;color:#fff;background:var(--blue);z-index:2}
.contact{max-width:720px;margin:26px auto 0;padding:34px 24px;border-radius:32px;display:flex;flex-direction:column;align-items:center;gap:16px}
.about{display:grid;gap:6px;text-align:left;font-size:.9rem;width:100%;max-width:420px}
.about div{display:flex;justify-content:space-between;gap:14px;border-bottom:1px solid rgba(255,255,255,.1);padding:6px 0}
.about span{color:var(--mute)}
.chan{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;font-size:.9rem}
.chan a{color:var(--ice);text-decoration:none;font-weight:500}
footer{text-align:center;padding:50px 20px 40px;color:var(--mute);font-size:.85rem}
footer a{color:var(--mute)}
#admin{position:fixed;inset:0;z-index:80;background:rgba(1,3,12,.6);backdrop-filter:blur(6px);display:none;justify-content:flex-end}
#admin.open{display:flex}
#panel{width:min(540px,100%);height:100%;overflow:auto;background:#0a0f1f;padding:20px;padding-bottom:calc(30px + env(safe-area-inset-bottom))}
#panel p.n{font-size:.82rem;color:var(--mute);margin:4px 0 14px}
#panel label{display:block;font-size:.82rem;font-weight:500;margin-top:12px}
#panel input,#panel textarea{width:100%;margin-top:4px;padding:10px 12px;border:1px solid #243055;border-radius:10px;font:inherit;font-size:.88rem;background:#060a16;color:#fff}
#panel textarea{min-height:90px;white-space:pre}
#panel .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
#panel small{display:block;color:var(--mute);font-weight:300}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
@media(max-width:560px){.brand .n{display:none}.banner video{border-radius:18px}}

/* ===== SAKURA THEME OVERRIDES ===== */
:root{--bg:#fff7fa;--blue:#ff7eb3;--blue2:#e8458b;--ice:#d6336c;--mute:#8a6b78}
body{color:#3b2433}
body::before{background:radial-gradient(55vmax 45vmax at 8% 0,rgba(255,170,205,.55) 0,transparent 60%),radial-gradient(50vmax 40vmax at 100% 30%,rgba(255,210,228,.7) 0,transparent 60%),radial-gradient(50vmax 40vmax at 30% 100%,rgba(255,190,215,.5) 0,transparent 60%)}
.glass{background:linear-gradient(135deg,rgba(255,255,255,.82),rgba(255,236,244,.5));box-shadow:inset 0 1px 0 #fff,inset 0 -1px 0 rgba(232,69,139,.08),0 12px 40px rgba(232,69,139,.18)}
.brand,.links a,.ch{color:#3b2433}
.links a:hover{background:rgba(232,69,139,.14)}
.tabs button{color:#3b2433}.tabs button.on{color:#fff}
.ind{background:linear-gradient(180deg,#ff8fb8,#e8458b);box-shadow:0 6px 20px rgba(232,69,139,.45)}
.btn.dark{background:linear-gradient(180deg,#ff8fb8,#e8458b);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 10px 30px rgba(232,69,139,.4)}
.btn.light{background:rgba(255,255,255,.75);color:#3b2433;box-shadow:inset 0 1px 0 #fff,0 0 0 1px rgba(232,69,139,.2)}
h1{background:linear-gradient(90deg,#e8458b,#ff7eb3 50%,#b83280);-webkit-background-clip:text;background-clip:text}
.tools i{background:rgba(255,126,179,.22);color:#d6336c;box-shadow:inset 0 1px 0 #fff}
.banner video{background:linear-gradient(120deg,#ffb3cf,#e8458b)}
.thumb{background:linear-gradient(160deg,#ffd3e3,#ff7eb3 70%,#e8458b);box-shadow:0 14px 34px rgba(232,69,139,.3)}
.card:hover .thumb{box-shadow:0 0 0 2px var(--blue),0 24px 60px rgba(232,69,139,.45)}
.cap{background:linear-gradient(transparent,rgba(110,20,65,.8))}
.ch:hover,.ch.armed{box-shadow:inset 0 1px 0 #fff,0 20px 50px rgba(232,69,139,.35)}
.ch em{background:rgba(232,69,139,.92)}
.res:hover{box-shadow:inset 0 1px 0 #fff,0 18px 44px rgba(232,69,139,.3)}
.modal{background:rgba(60,10,40,.6)}
.about div{border-bottom-color:rgba(59,36,51,.12)}
.sun{position:fixed;z-index:-1;width:min(62vmin,520px);aspect-ratio:1;border-radius:50%;top:14vh;left:50%;transform:translateX(-50%);background:radial-gradient(circle,#ffd0e2 0,#ffe3ee 55%,transparent 72%);opacity:.85;pointer-events:none}
.tree{position:fixed;top:0;z-index:-1;width:min(52vw,560px);height:auto;pointer-events:none}
.tree.l{left:0}.tree.r{right:0;transform:scaleX(-1)}
#petals{position:fixed;inset:0;pointer-events:none;z-index:40}

/* ===== FUJI / TORII (bold, white + pink) OVERRIDES ===== */
@font-face{font-family:"Gotham";font-weight:700;font-style:normal;src:local("Gotham Bold"),local("Gotham-Bold"),url("fonts/Gotham-Bold.woff2") format("woff2"),url("fonts/Gotham-Bold.woff") format("woff"),url("fonts/Gotham-Bold.otf") format("opentype"),url("fonts/Gotham-Bold.ttf") format("truetype");font-display:swap}
:root{--blue:#ff4f8b;--blue2:#e0125f;--ice:#d1105a;--ink:#1a0f16;--mute:#6f5663}
body{color:var(--ink)}
body::before{background:radial-gradient(rgba(224,18,95,.14) 1.3px,transparent 1.7px) 0 0/16px 16px,radial-gradient(55vmax 45vmax at 8% 0,rgba(255,170,205,.55) 0,transparent 60%),radial-gradient(50vmax 40vmax at 100% 30%,rgba(255,210,228,.7) 0,transparent 60%),radial-gradient(50vmax 40vmax at 30% 100%,rgba(255,190,215,.5) 0,transparent 60%)}
h1,h2,.fl b,.res b,.rate b{font-weight:700}
.brand,.links a,.ch,.tabs button{color:var(--ink)}
.links a:hover{background:rgba(224,18,95,.12)}
.glass{background:rgba(255,255,255,.88);border:1.5px solid var(--ink);box-shadow:5px 5px 0 var(--blue)}
nav.glass{box-shadow:3px 3px 0 var(--blue);border-radius:14px}
.tabs,.fl,.rate div{border-radius:14px}
.tabs button.on{color:#fff}
.tabs button,.ind{border-radius:9px}
.ind{background:var(--blue2);box-shadow:none}
.pad,.rv,.contact{border-radius:16px}
.btn{border-radius:10px}
.btn.dark{background:var(--ink);color:#fff;box-shadow:4px 4px 0 var(--blue)}
.btn.dark:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--blue)}
.btn.light{background:#fff;color:var(--ink);border:1.5px solid var(--ink);box-shadow:4px 4px 0 var(--ink)}
.btn.light:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
h1{background:linear-gradient(90deg,#1a0f16 0,#e0125f 62%,#ff4f8b);-webkit-background-clip:text;background-clip:text;letter-spacing:-.04em}
.tools i{background:#fff;border:1.5px solid var(--ink);color:var(--blue2);border-radius:8px;box-shadow:2px 2px 0 var(--blue)}
.banner video{border-radius:14px;background:linear-gradient(120deg,#ffb3cf,#e0125f)}
.thumb{border-radius:12px;border:1.5px solid var(--ink);box-shadow:4px 4px 0 var(--ink)}
.card:hover .thumb{transform:translate(-4px,-4px) scale(1.02);box-shadow:8px 8px 0 var(--blue)}
.ch:hover,.ch.armed,.res:hover{transform:translate(-3px,-3px);box-shadow:8px 8px 0 var(--blue2)}
.ch em{background:var(--blue2)}
.ch .av{border:1.5px solid var(--ink)}
.avs button.on,.avs button:hover{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--blue2)}
.about div{border-bottom-color:rgba(26,15,22,.15)}
.sun{display:none}
.scene{position:fixed;left:0;bottom:0;width:100%;height:min(36vh,330px);z-index:-1;pointer-events:none}
body::after{content:"日本 · NIPPON";position:fixed;right:12px;top:50%;transform:translateY(-50%);writing-mode:vertical-rl;font-weight:700;font-size:.85rem;letter-spacing:.55em;color:var(--blue2);opacity:.85;pointer-events:none;z-index:1}
@media(max-width:1250px){body::after{display:none}}

/* ===== MOBILE + ADMIN ===== */
@media(max-width:700px){
  .grid{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;justify-content:flex-start;gap:14px;padding:6px 20px 24px;margin:0 -20px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .grid::-webkit-scrollbar{display:none}
  .grid .card{flex:0 0 58%;max-width:240px;scroll-snap-align:center}
  .grid.long .card{flex:0 0 84%;max-width:360px}
}
#panel .lb{margin-top:12px;font-size:.82rem;font-weight:500}
#panel .lb span{display:block}
#panel h4{margin-top:24px;font-weight:700}

/* ===== RIBBON + MOBILE SPACING ===== */
section.s{padding-left:20px;padding-right:20px}
.banner{margin-top:34px}
.rib{overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin:26px -20px 0;padding:0 20px;cursor:grab;-webkit-mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent);mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent)}
.rib::-webkit-scrollbar{display:none}
.rin{position:relative}
.rin svg{position:absolute;left:0;top:0;overflow:visible}
.node{position:absolute;width:72px;color:var(--ink);text-decoration:none;transition:transform .3s}
.node .av{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--blue2));overflow:hidden;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--ink),0 8px 20px rgba(0,0,0,.25);display:grid;place-items:center;color:#fff;font-weight:700;font-size:1.4rem}
.node img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.node b{display:block;width:150px;margin:8px -39px 0;text-align:center;font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node:hover{transform:translateY(-6px) scale(1.08)}
@media(max-width:700px){
  .grid{--cw:min(58vw,240px);width:100vw;margin:0 0 0 calc(50% - 50vw);padding:6px calc((100vw - var(--cw))/2) 24px}
  .grid.long{--cw:min(84vw,360px)}
  .grid .card,.grid.long .card{flex:0 0 var(--cw);max-width:none}
}

/* ===== LOGO SHAPE ===== */
.brand img.lg{height:38px;width:38px;object-fit:cover;display:block}
.brand img.lg.round{border-radius:50%}
.brand img.lg.rounded{border-radius:10px}
.brand img.lg.original{width:auto;height:34px;object-fit:contain;border-radius:0}
#logoSlot.round .fb{border-radius:50%}

/* ===== RED + BLACK / LIQUID GLASS THEME ===== */
:root{--bg:#050203;--blue:#ff2a3d;--blue2:#c4001a;--ice:#ff6b78;--ink:#fff;--mute:#b9a3a8}
body{color:#fff;background:var(--bg)}
body::before{background:
  radial-gradient(rgba(255,40,60,.11) 1.3px,transparent 1.7px) 0 0/16px 16px,
  radial-gradient(55vmax 45vmax at 6% 0,rgba(255,25,50,.34) 0,transparent 60%),
  radial-gradient(50vmax 40vmax at 100% 28%,rgba(190,0,25,.34) 0,transparent 60%),
  radial-gradient(50vmax 40vmax at 30% 100%,rgba(255,25,50,.20) 0,transparent 60%)}
.brand,.links a,.ch,.tabs button,.node{color:#fff}
.links a:hover{background:rgba(255,42,61,.22)}
h1,h2,.fl b,.res b,.rate b{font-weight:700}
h1{background:linear-gradient(90deg,#fff 8%,#ff8a94 48%,#ff1f3d 95%);-webkit-background-clip:text;background-clip:text;letter-spacing:-.04em}
.star{color:#ff4a5a}

/* --- liquid glass --- */
.glass,nav.glass{
  background:
    radial-gradient(120% 90% at 0% 0%,rgba(255,255,255,.26) 0,rgba(255,255,255,0) 46%),
    radial-gradient(90% 70% at 100% 100%,rgba(255,40,60,.20) 0,rgba(255,40,60,0) 60%),
    linear-gradient(135deg,rgba(255,255,255,.13),rgba(255,255,255,.03));
  -webkit-backdrop-filter:blur(20px) saturate(190%) brightness(1.08);
  backdrop-filter:blur(20px) saturate(190%) brightness(1.08);
  border:1px solid rgba(255,255,255,.20);
  box-shadow:
    inset 0 1.5px 1px rgba(255,255,255,.60),
    inset 0 -1.5px 1px rgba(255,255,255,.12),
    inset 1px 0 1px rgba(255,255,255,.18),
    inset 0 0 28px rgba(255,255,255,.06),
    0 18px 50px rgba(0,0,0,.60),
    0 0 44px rgba(255,30,50,.14)}
nav.glass{border-radius:999px}
.tabs,.tabs button,.ind{border-radius:999px}
.fl,.rate div{border-radius:22px}
.pad{border-radius:26px}.rv{border-radius:30px}.contact{border-radius:32px}

/* buttons */
.btn{border-radius:999px;border:1px solid rgba(255,255,255,.22)}
.btn.dark{
  color:#fff;
  background:radial-gradient(120% 120% at 20% 0%,rgba(255,255,255,.45) 0,rgba(255,255,255,0) 45%),linear-gradient(180deg,rgba(255,70,88,.95),rgba(190,0,26,.92));
  -webkit-backdrop-filter:blur(10px) saturate(180%);backdrop-filter:blur(10px) saturate(180%);
  box-shadow:inset 0 1.5px 1px rgba(255,255,255,.70),inset 0 -2px 6px rgba(90,0,10,.45),0 10px 30px rgba(255,30,50,.45)}
.btn.dark:hover{transform:translateY(-2px);box-shadow:inset 0 1.5px 1px rgba(255,255,255,.80),inset 0 -2px 6px rgba(90,0,10,.45),0 14px 38px rgba(255,30,50,.65)}
.btn.light{
  color:#fff;
  background:radial-gradient(120% 120% at 20% 0%,rgba(255,255,255,.28) 0,rgba(255,255,255,0) 50%),linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.04));
  -webkit-backdrop-filter:blur(14px) saturate(180%);backdrop-filter:blur(14px) saturate(180%);
  box-shadow:inset 0 1.5px 1px rgba(255,255,255,.50),0 8px 24px rgba(0,0,0,.45)}
.btn.light:hover{transform:translateY(-2px);box-shadow:inset 0 1.5px 1px rgba(255,255,255,.65),0 12px 30px rgba(255,30,50,.30)}

/* tab indicator */
.ind{background:radial-gradient(120% 120% at 20% 0%,rgba(255,255,255,.40) 0,rgba(255,255,255,0) 50%),linear-gradient(180deg,rgba(255,70,88,.95),rgba(190,0,26,.92));
  box-shadow:inset 0 1.5px 1px rgba(255,255,255,.65),0 6px 22px rgba(255,30,50,.55)}
.tabs button.on{color:#fff}

/* chips + media */
.tools i{background:linear-gradient(135deg,rgba(255,255,255,.20),rgba(255,42,61,.18));border:1px solid rgba(255,255,255,.25);color:#ff8a94;border-radius:11px;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:inset 0 1px 1px rgba(255,255,255,.5),0 4px 14px rgba(255,30,50,.25)}
.banner video{border-radius:28px;border:1px solid rgba(255,255,255,.18);background:linear-gradient(120deg,#2a0007,#c4001a);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.4),0 20px 60px rgba(0,0,0,.6),0 0 60px rgba(255,30,50,.18)}
.thumb{border-radius:22px;border:1px solid rgba(255,255,255,.20);background:linear-gradient(160deg,#1a0307,#7a0a1a 70%,#ff2a3d);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.35),0 14px 34px rgba(0,0,0,.65)}
.card:hover .thumb{transform:translateY(-8px) scale(1.04);box-shadow:0 0 0 1px rgba(255,90,105,.9),0 24px 60px rgba(255,30,50,.45)}
.cap{background:linear-gradient(transparent,rgba(25,0,5,.88))}
.ch:hover,.ch.armed,.res:hover{transform:translateY(-8px);
  box-shadow:inset 0 1.5px 1px rgba(255,255,255,.6),0 20px 50px rgba(255,30,50,.40)}
.ch em{background:rgba(196,0,26,.88);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.ch .av{border:1px solid rgba(255,255,255,.35)}
.avs button.on,.avs button:hover{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--blue)}
.about div{border-bottom-color:rgba(255,255,255,.12)}
.chan a{color:#ff6b78}
.x{background:linear-gradient(180deg,#ff4658,#c4001a);box-shadow:inset 0 1px 1px rgba(255,255,255,.6),0 6px 18px rgba(255,30,50,.5)}
.modal{background:rgba(0,0,0,.78);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.node .av{border:3px solid rgba(255,255,255,.75);box-shadow:0 0 0 1.5px rgba(255,255,255,.18),0 8px 20px rgba(0,0,0,.5)}
body::after{color:#ff3347;opacity:.9}

/* admin panel */
#admin{background:rgba(0,0,0,.6)}
#panel{background:#0c0507}
#panel input,#panel textarea,#panel select{background:#060203;border-color:#3a1219;color:#fff}
#panel .it{background:#1a0a0e}
#panel .sticky{background:#0c0507}

/* ===== FIXES: fonts, buttons, logo, video links, mobile background ===== */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,input,select,textarea{font-family:inherit}
h1{font-family:var(--display);font-weight:800;letter-spacing:-.02em;line-height:1.05}

/* buttons stay red glass (no black / white fills) */
.btn.light{color:#fff;border:1px solid rgba(255,90,105,.55);
  background:radial-gradient(120% 120% at 20% 0%,rgba(255,255,255,.22) 0,rgba(255,255,255,0) 50%),linear-gradient(135deg,rgba(255,42,61,.30),rgba(196,0,26,.16));
  box-shadow:inset 0 1.5px 1px rgba(255,255,255,.45),0 8px 24px rgba(255,30,50,.22)}
.btn.light:hover{border-color:rgba(255,125,137,.9);box-shadow:inset 0 1.5px 1px rgba(255,255,255,.6),0 12px 30px rgba(255,30,50,.40)}
.btn.dark{border-color:rgba(255,160,170,.45)}

/* logo: keep the uploaded logo's own shape by default */
#logoSlot{display:flex;flex:none}
.fb{flex:none;width:40px;height:40px}
.brand img.lg{height:40px;width:40px;object-fit:cover;flex:none}
.brand img.lg.auto,.brand img.lg.original{width:auto;max-width:130px;height:40px;object-fit:contain;border-radius:0;background:none}
.brand img.lg.round{border-radius:50%}
.brand img.lg.rounded{border-radius:10px}
#logoSlot.round .fb,#logoSlot.auto .fb,#logoSlot.original .fb{border-radius:50%}

/* video links */
.ph{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:12px;font-weight:700;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:#fff}
.nofr{padding:28px 22px;border-radius:22px;text-align:center;display:grid;gap:16px;justify-items:center}
.orig{display:block;text-align:center;margin-top:12px;font-size:.85rem;color:#ff8a94;text-decoration:none}
#panel .vsrc{display:grid;gap:8px;margin-top:4px}
#panel .vsrc .btn{width:100%}
#panel .vsrc .or{font-size:.75rem;color:var(--mute);text-align:center}
#panel .vst{color:#ff8a94;font-size:.78rem;margin:0}

/* blossom trees must never be clipped or hidden */
.tree{overflow:visible}

/* mobile background: trees sit below the nav, one high on the left, one low on the right above Fuji */
@media(max-width:700px){
  .tree{width:88vw;opacity:.75}
  .tree.l{left:-18vw;top:calc(env(safe-area-inset-top,0px) + 66px)}
  .tree.r{right:-22vw;top:auto;bottom:calc(min(30vh,250px) - 30px);bottom:calc(min(30svh,250px) - 30px)}
  .scene{height:min(30vh,250px);height:min(30svh,250px)}
}

h1{font-family:"Gokure",var(--display);font-weight:400;font-synthesis:none;letter-spacing:.01em;line-height:1.12;font-size:clamp(2.3rem,8vw,5.5rem)}

/* buttons: solid tinted red, no white gloss, glow on click */
.btn,.btn.dark,.btn.light{-webkit-backdrop-filter:none;backdrop-filter:none}
.btn.dark{background:linear-gradient(180deg,rgba(236,30,52,.92),rgba(170,0,22,.94));border:1px solid rgba(255,80,98,.55);box-shadow:0 6px 18px rgba(200,0,26,.35)}
.btn.light{background:linear-gradient(180deg,rgba(150,10,28,.62),rgba(95,0,16,.68));border:1px solid rgba(255,80,98,.45);box-shadow:0 6px 18px rgba(120,0,18,.35)}
.btn.dark:hover,.btn.light:hover{box-shadow:0 8px 24px rgba(255,40,60,.45)}
.btn.dark:active,.btn.light:active,.btn.dark.glow,.btn.light.glow{box-shadow:0 0 0 3px rgba(255,70,90,.35),0 0 26px 6px rgba(255,40,60,.8)}
.btn.glow{animation:btnglow .8s ease-out}
@keyframes btnglow{from{box-shadow:0 0 0 4px rgba(255,70,90,.45),0 0 34px 10px rgba(255,40,60,.95)}to{box-shadow:0 0 0 0 rgba(255,70,90,0),0 0 0 0 rgba(255,40,60,0)}}
.ind{background:linear-gradient(180deg,rgba(236,30,52,.92),rgba(170,0,22,.94));box-shadow:0 6px 18px rgba(255,30,50,.35)}
.x{background:linear-gradient(180deg,#e81e34,#aa0016);box-shadow:0 6px 18px rgba(255,30,50,.45)}

/* no blue tap box / blue selection on buttons */
*{-webkit-tap-highlight-color:transparent}
a,button,.card,.node,.ch,.tabs,.avs button{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
a:focus:not(:focus-visible),button:focus:not(:focus-visible){outline:none}
a:focus-visible,button:focus-visible{outline:2px solid #ff4a5a;outline-offset:2px}

/* text selection is red everywhere */
::selection{background:rgba(255,42,61,.6);color:#fff}
::-moz-selection{background:rgba(255,42,61,.6);color:#fff}

/* ===== DARK RED NAME + STATS ORBITING THE NAME ===== */
h1{position:relative;z-index:1;background:linear-gradient(90deg,#c0001f 0%,#8f0015 55%,#b3001c 100%);-webkit-background-clip:text;background-clip:text;filter:url(#liquid) drop-shadow(0 0 16px rgba(255,30,55,.4))}
.stage{padding:72px 0}
.stage .fls{position:absolute;inset:0;margin:0;display:block;pointer-events:none}
.stage .fls .fl{position:absolute;left:50%;top:50%;right:auto;bottom:auto;animation:none;will-change:transform}
@media(max-width:700px){
  .stage{padding:64px 0}
  .stage .fls .fl{padding:7px 12px;border-radius:16px}
  .fl b{font-size:1.05rem}
  .fl span{font-size:.62rem}
}

/* ===== BRIGHT RED NAME (palette-controlled) + RED STATS/TOOLS + MOBILE TOP BAR NAME ===== */
h1{background:var(--nameC,#ff1f3d);-webkit-background-clip:text;background-clip:text;filter:url(#liquid) drop-shadow(0 0 16px var(--nameGlow,rgba(255,31,61,.45)))}
.tools,.tools span{color:var(--accC,#ff1f3d)}
.tools i{color:var(--accC,#ff1f3d)}
.fl b,.fl span{color:var(--accC,#ff1f3d)}
.brand{min-width:0;flex:1 1 auto}
.brand .n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#navCta{flex:none;white-space:nowrap}
@media(max-width:560px){
  .brand .n{display:block;font-size:.95rem}
  nav{gap:8px;padding:8px 8px 8px 12px}
  #navCta.btn.sm{padding:8px 14px;font-size:.8rem}
}
#panel .pal{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}
#panel .sw{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.35);padding:0;cursor:pointer}
#panel .sw.on{outline:2px solid #fff;outline-offset:2px}
#panel input[type=color]{width:56px;height:34px;padding:2px;margin-top:0;flex:none;cursor:pointer}

/* per-video CTR */
.vctr{margin-top:10px;text-align:center;font-size:.85rem;color:var(--mute)}
.vctr b{color:var(--accC,#ff1f3d);font-weight:700}

/* ===== LOADING SCREEN: your name fills up like liquid ===== */
#loader{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:0 4vw;background:radial-gradient(120% 90% at 50% 40%,#2a0509 0%,#050203 70%);transition:opacity .8s ease,visibility .8s}
#loader.done{opacity:0;visibility:hidden;pointer-events:none}
#loader .ldname{position:relative;max-width:94vw;text-align:center;font-family:"Gokure",var(--display);font-weight:400;font-synthesis:none;font-size:clamp(2.6rem,10vw,7rem);line-height:1.12;letter-spacing:.01em;filter:url(#liquid);transition:transform .8s cubic-bezier(.2,.7,.2,1),opacity .8s ease}
#loader.done .ldname{transform:scale(1.12);opacity:0}
#loader .ldname span{display:block}
#loader .ldname .b{color:transparent;-webkit-text-stroke:1.5px rgba(255,42,61,.45)}
#loader .ldname .f{position:absolute;left:0;top:0;width:100%;color:var(--nameC,#ff1f3d);text-shadow:0 0 24px var(--nameGlow,rgba(255,31,61,.5));-webkit-mask-image:linear-gradient(to top,#000 0,#000 var(--lp,0%),transparent calc(var(--lp,0%) + 14%));mask-image:linear-gradient(to top,#000 0,#000 var(--lp,0%),transparent calc(var(--lp,0%) + 14%))}
#loader .ldp{font:700 .8rem/1 var(--font,sans-serif);letter-spacing:.4em;padding-left:.4em;color:#ff2a3d}
body.loading{overflow:hidden}
/* content slides in once the loader lifts */
@keyframes ldUp{from{opacity:0;transform:translateY(24px)}}
@keyframes ldDown{from{opacity:0;transform:translateY(-18px)}}
body.ready nav{animation:ldDown .8s ease backwards}
body.ready #home>*{animation:ldUp .9s cubic-bezier(.2,.7,.2,1) backwards}
body.ready #home>*:nth-child(1){animation-delay:.05s}
body.ready #home>*:nth-child(2){animation-delay:.15s}
body.ready #home>*:nth-child(3){animation-delay:.25s}
body.ready #home>*:nth-child(n+4){animation-delay:.35s}

(function(){

  function paint(){F.style.setProperty("--lp",(p*1.14-14).toFixed(1)+"%");N.textContent=Math.round(p)}

  function frame(){

  }

  setTimeout(function(){window.__hideLoader(true)},6000);

function count(el,txt){
  const m=String(txt).match(/[\d.]+/);if(!m||reduce){el.textContent=txt;return}
  const n=parseFloat(m[0]),d=(m[0].split(".")[1]||"").length,pre=txt.slice(0,m.index),post=txt.slice(m.index+m[0].length);
  el.textContent=pre+(0).toFixed(d)+post;
  (function w(){if(!window.__ready){requestAnimationFrame(w);return}const t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/1400),e=1-Math.pow(1-k,3);el.textContent=pre+(n*e).toFixed(d)+post;if(k<1)requestAnimationFrame(f)})(t0)})();
}

let lastW=0;
function ribbon(){
  const box=$("#chList"),L=C.channels,n=L.length;box.className="rib";lastW=innerWidth;
  const W=Math.max(innerWidth-40,n*190+120),H=250,cy=120,e=Math.min(130,W*.2);
  const y=x=>cy+44*Math.sin(x/95)+14*Math.sin(x/37+1);
  const path=(a,b)=>{let d="";for(let x=a;x<=b;x+=6)d+=(d?"L":"M")+x+","+y(x).toFixed(1);return d};
  const seg=(a,b,c)=>`<path d="${path(a,b)}" fill="none" stroke="${c}" stroke-width="20" stroke-linecap="butt" stroke-linejoin="round"/>`;
  const X=i=>n>1?80+i*((W-160)/(n-1)):W/2;
  const sq=(x,yy)=>`<rect x="${x}" y="${yy}" width="5" height="5" fill="#fff" opacity=".9"/>`;
  const patch=x=>{const a=(Math.atan2(y(x+2)-y(x-2),4)*180/Math.PI).toFixed(1);return `<g transform="translate(${x} ${y(x).toFixed(1)}) rotate(${a})"><rect x="-36" y="-12" width="72" height="24" rx="2" fill="#6f8fe0"/><rect x="-11" y="-12" width="22" height="24" fill="#e8231f"/><path d="M-6,4 C-6,-8 4,-8 3,-1 C2,5 -4,3 -1,-3" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>${[-31,-24,-17,13,20,27].map(k=>sq(k,-9)+sq(k,4)).join("")}</g>`};
  const fringe=(x,s)=>{const cols=["#f23a2a","#ffa81c","#3cb878","#4a86e8","#f7d33a","#f23a2a","#ff8fb3"];return `<g transform="translate(${x} ${y(x).toFixed(1)})"><rect x="${s<0?-6:-2}" y="-11" width="8" height="22" rx="3" fill="#c92a1d"/>${cols.map((c,i)=>{const a=(i-3)*9*Math.PI/180,l=24+(i%3)*4;return `<path d="M${s*4},${((i-3)*2.4).toFixed(1)} l${(s*Math.cos(a)*l).toFixed(1)},${(Math.sin(a)*l).toFixed(1)}" stroke="${c}" stroke-width="3" stroke-linecap="round"/>`}).join("")}</g>`};
  let svg=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true">`;
  svg+=`<path d="${path(16,W-16)}" fill="none" stroke="rgba(120,20,20,.25)" stroke-width="24" transform="translate(0,3)"/>`+seg(16,e,"#f23a2a")+seg(e,W-e,"#ffa81c")+seg(W-e,W-16,"#f23a2a")+`<path d="${path(16,W-16)}" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="3" transform="translate(0,-5)"/>`;
  for(let i=0;i<n-1;i++)svg+=patch((X(i)+X(i+1))/2);
  if(n<2)svg+=patch(W/2+120);
  svg+=fringe(16,-1)+fringe(W-16,1)+"</svg>";
  const nodes=L.map((c,i)=>{const x=X(i);return `<a class="node" href="${esc(c.link)}" target="_blank" rel="noopener" title="${esc(c.subs)}" style="left:${x-36}px;top:${(y(x)-36).toFixed(1)}px"><div class="av">${c.img?`<img alt="" src="${esc(c.img)}">`:esc((c.name||"?").charAt(0))}</div><b>${esc(c.name)}</b></a>`}).join("");
  box.innerHTML=`<div class="rin" style="width:${W}px;height:${H}px">${svg}${nodes}</div>`;
}

function build(list,el,vert){

function openVideo(v,vert){

/* ===== VIDEO LINKS: YouTube, Instagram, TikTok, Facebook, Vimeo, Drive, Loom, Dailymotion, direct files ===== */
const PLAT={youtube:"YouTube",instagram:"Instagram",tiktok:"TikTok",facebook:"Facebook",vimeo:"Vimeo",drive:"Google Drive",loom:"Loom",dailymotion:"Dailymotion",twitter:"X / Twitter",file:"Video file",link:"Link"};
function parseLink(u){
  u=String(u||"").trim();if(!u)return null;
  if(!/^https?:\/\//i.test(u))u="https://"+u.replace(/^\/\//,"");
  let m;const id=ytId(u);
  if(id)return{plat:"youtube",embed:"https://www.youtube.com/embed/"+id+"?autoplay=1&rel=0",thumb:"https://img.youtube.com/vi/"+id+"/hqdefault.jpg",url:u};
  if(m=u.match(/instagram\.com\/(?:[\w.]+\/)?(reel|reels|p|tv)\/([\w-]+)/i))return{plat:"instagram",embed:"https://www.instagram.com/"+(m[1]==="p"||m[1]==="tv"?"p":"reel")+"/"+m[2]+"/embed/",vert:true,url:u};
  if(m=u.match(/tiktok\.com\/(?:@[\w.-]+\/)?video\/(\d+)/i))return{plat:"tiktok",embed:"https://www.tiktok.com/embed/v2/"+m[1],vert:true,url:u};
  if(/facebook\.com|fb\.watch/i.test(u))return{plat:"facebook",embed:"https://www.facebook.com/plugins/video.php?href="+encodeURIComponent(u)+"&show_text=false&autoplay=true",vert:/\/reel\//i.test(u)?true:undefined,url:u};
  if(m=u.match(/vimeo\.com\/(?:[^?#]*\/)?(\d+)(?:\/(\w+))?/i))return{plat:"vimeo",embed:"https://player.vimeo.com/video/"+m[1]+"?autoplay=1"+(m[2]?"&h="+m[2]:""),url:u};
  if(m=u.match(/drive\.google\.com\/file\/d\/([\w-]+)/i))return{plat:"drive",embed:"https://drive.google.com/file/d/"+m[1]+"/preview",url:u};
  if(m=u.match(/loom\.com\/(?:share|embed)\/(\w+)/i))return{plat:"loom",embed:"https://www.loom.com/embed/"+m[1]+"?autoplay=1",url:u};
  if(m=u.match(/dailymotion\.com\/video\/(\w+)/i))return{plat:"dailymotion",embed:"https://www.dailymotion.com/embed/video/"+m[1]+"?autoplay=1",url:u};
  if(/\.(mp4|webm|mov|m4v|ogv)(\?|#|$)/i.test(u))return{plat:"file",file:true,url:u};
  if(/(^|\/\/)(www\.)?(x|twitter)\.com\//i.test(u))return{plat:"twitter",url:u};
  return{plat:"link",url:u};
}
function vinfo(v){
  if(v.type==="youtube"){const id=String(v.src||"").trim();return{plat:"youtube",embed:"https://www.youtube.com/embed/"+encodeURIComponent(id)+"?autoplay=1&rel=0",thumb:"https://img.youtube.com/vi/"+encodeURIComponent(id)+"/hqdefault.jpg",url:"https://youtu.be/"+id}}
  if(v.type==="link")return parseLink(v.src)||{plat:"link",url:""};
  return{plat:"file",file:true,url:v.src||""};
}
const fname=x=>{try{return decodeURIComponent(String(x).split("?")[0].split("/").pop())}catch(e){return String(x)}};
const vstatus=o=>{
  if(o.type==="file")return o.src?"✓ Uploaded video in use: "+fname(o.src):"No video yet. Upload a file or paste a link.";
  const i=vinfo(o);return "✓ "+(PLAT[i.plat]||"Link")+(i.embed||i.file?" link. Plays on your site.":" link. Opens in a new tab when tapped.");
};
function vrow(k,i,o){

const ctrNum=v=>{const t=String(v==null?"":v).trim();if(!t)return null;const n=parseFloat(t.replace(",",".").replace(/[^\d.]/g,""));return isFinite(n)?n:null};

if(!reduce){
  const turb=$("#turb"),disp=$("#disp"),h=$("#title"),touch=matchMedia("(hover:none)").matches,base=touch?3:4,hot=touch?12:46,press=touch?18:70;let cur=base,target=base,t=0;
  const hit=(x,y)=>{const r=h.getBoundingClientRect();return x>r.left-30&&x<r.right+30&&y>r.top-30&&y<r.bottom+30};
  addEventListener("pointermove",e=>{target=hit(e.clientX,e.clientY)?hot:base},{passive:true});
  h.addEventListener("pointerdown",()=>{target=press});addEventListener("pointerup",()=>{if(touch)target=base});

  $("#panel").innerHTML=`<h3>Site manager</h3><p class="n">Change anything, then press Save to website. It goes live for everyone with no GitHub step. Empty lists hide their section.</p><h4>Basics</h4>`+
    TEXT.map(t=>t[2]==="shape"?shapeSel(t):t[2]==="color"?colorSel(t):`<div class="lb"><span>${t[1]}</span><div class="f"><input data-t="${t[0]}" value="${esc(C[t[0]])}">${t[2]?`<button class="btn light sm" data-up="${t[2]}/*">Upload</button>`:""}</div></div>`).join("")+
    Object.keys(LISTS).map(k=>`<h4>${LISTS[k][0]}</h4><p class="n">${LISTS[k][1]}</p>${C[k].map((o,i)=>row(k,i,o)).join("")}<button class="btn light sm" data-add="${k}" style="margin-top:8px">+ Add</button>`).join("")+
    `<div class="row sticky"><button class="btn dark sm" data-save>Save to website</button><button class="btn light sm" data-dl>Download backup</button><button class="btn light sm" data-close>Close</button></div>`;
  $("#admin").classList.add("open");
}
function reopen(){const p=$("#panel"),st=p.scrollTop;openAdmin();p.scrollTop=st}
async function uploadFile(f){
  const {upload}=await import("https://esm.sh/@vercel/blob@0.27.0/client");
  const b=await upload("uploads/"+f.name,f,{access:"public",handleUploadUrl:"/api/upload",clientPayload:PW});
  return b.url;
}
async function save(){
  if(location.protocol==="file:"){alert("Open your live site to save.");return}
  const r=await fetch("/api/content",{method:"POST",headers:{"content-type":"application/json","x-admin-password":PW},body:JSON.stringify(C)}).catch(()=>null);
  alert(r&&r.ok?"Saved. Your site is updated (may take up to a minute to show for visitors).":"Save failed. Check the Vercel setup steps.");
}
$("#panel").addEventListener("change",e=>{
  const t=e.target,it=t.closest(".it");
  if(it&&t.dataset.f){const o=C[it.dataset.k][+it.dataset.i],f=t.dataset.f;
    if(f==="link"){const v=t.value.trim();
      if(!v){if(o.type!=="file"){o.type="file";o.src=""}}
      else{const id=ytId(v);if(id){o.type="youtube";o.src=id;t.value="https://youtu.be/"+id}else{o.type="link";o.src=/^https?:\/\//i.test(v)?v:"https://"+v.replace(/^\/\//,"");t.value=o.src}}
      const st=it.querySelector(".vst");if(st)st.textContent=vstatus(o)}
    else if(f==="src"&&(it.dataset.k==="shorts"||it.dataset.k==="long")){const id=ytId(t.value);if(id){o.type="youtube";o.src=id;t.value="https://youtu.be/"+id}else{o.type="file";o.src=t.value}}
    else o[f]=t.value;
    refresh()}
  else if(t.dataset.t){C[t.dataset.t]=t.value;refresh()}
});
$("#panel").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;const it=b.closest(".it");
  if(b.hasAttribute("data-del")){C[it.dataset.k].splice(+it.dataset.i,1);refresh();reopen()}
  else if(b.dataset.add){const k=b.dataset.add;C[k].push(Object.fromEntries(LISTS[k][2].map(f=>[f,f==="type"?"file":""])));refresh();reopen()}
  else if(b.dataset.up){
    const inp=document.createElement("input");inp.type="file";inp.accept=b.dataset.up;
    inp.onchange=async()=>{const f=inp.files[0];if(!f)return;const old=b.textContent;b.textContent="Uploading…";b.disabled=true;
      try{const url=await uploadFile(f);const box=b.previousElementSibling;box.value=url;box.dispatchEvent(new Event("change",{bubbles:true}));reopen()}
      catch(err){alert("Upload failed: "+(err.message||err));b.textContent=old;b.disabled=false}};
    inp.click();
  }
  else if(b.hasAttribute("data-upv")){
    const inp=document.createElement("input");inp.type="file";inp.accept="video/*";
    inp.onchange=async()=>{const f=inp.files[0];if(!f)return;const old=b.textContent;b.textContent="Uploading…";b.disabled=true;
      try{const url=await uploadFile(f);const o=C[it.dataset.k][+it.dataset.i];o.type="file";o.src=url;refresh();reopen()}
      catch(err){alert("Upload failed: "+(err.message||err));b.textContent=old;b.disabled=false}};
    inp.click();
  }
  else if(b.dataset.color){C[b.closest(".pal").dataset.key]=b.dataset.color;applyColors();reopen()}
  else if(b.hasAttribute("data-save"))save();
  else if(b.hasAttribute("data-dl")){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(C,null,2)],{type:"application/json"}));a.download="content-backup.json";a.click()}
  else if(b.hasAttribute("data-close")){$("#admin").classList.remove("open");location.hash=""}
});
async function checkAdmin(){
  if(location.hash!=="#admin")return;
  if(location.protocol==="file:"){openAdmin();return}
  const p=prompt("Admin password");if(!p){location.hash="";return}
  const r=await fetch("/api/content",{method:"POST",headers:{"content-type":"application/json","x-admin-password":p},body:JSON.stringify({verify:true})}).catch(()=>null);
  if(r&&r.ok){PW=p;openAdmin()}
  else{alert(r&&r.status===401?"Wrong password.":"Admin is not set up yet. Follow the Vercel setup steps.");location.hash=""}
}
document.addEventListener("click",e=>{const b=e.target.closest(".btn");if(!b)return;b.classList.remove("glow");void b.offsetWidth;b.classList.add("glow");setTimeout(()=>b.classList.remove("glow"),800)});
addEventListener("hashchange",checkAdmin);
init();
</script>

<script>
/* ===== SAKURA: trees + falling petals ===== */
(function(){
  const NS="http://www.w3.org/2000/svg",pal=["#ffffff","#fff8f9","#fff1f3","#ffffff","#ffe9ec"];
  const rnd=a=>a[Math.floor(Math.random()*a.length)];
  function flower(svg,x,y){
    const g=document.createElementNS(NS,"g"),s=1+Math.random()*.7,c=rnd(pal);
    g.setAttribute("transform",`translate(${x} ${y}) scale(${s}) rotate(${Math.random()*72})`);
    for(let k=0;k<5;k++){const e=document.createElementNS(NS,"circle"),a=k*1.2566;e.setAttribute("cx",Math.cos(a)*4.6);e.setAttribute("cy",Math.sin(a)*4.6);e.setAttribute("r",4.3);e.setAttribute("fill",c);e.setAttribute("opacity",".93");g.appendChild(e)}
    const m=document.createElementNS(NS,"circle");m.setAttribute("r",1.7);m.setAttribute("fill","#ff2a3d");g.appendChild(m);svg.appendChild(g);
  }
  function tree(cls){
    const svg=document.createElementNS(NS,"svg");svg.setAttribute("viewBox","0 0 400 300");svg.setAttribute("class","tree "+cls);svg.setAttribute("aria-hidden","true");document.body.appendChild(svg);
    const P=["M-10,30 C90,50 150,20 230,80 S330,150 380,140","M120,40 C150,90 140,140 170,190","M230,80 C260,40 300,40 340,20","M300,118 C320,170 300,210 330,250"],W=[9,5,5,4];
    P.forEach((d,i)=>{const p=document.createElementNS(NS,"path");p.setAttribute("d",d);p.setAttribute("fill","none");p.setAttribute("stroke","#8a1f30");p.setAttribute("stroke-width",W[i]);p.setAttribute("stroke-linecap","round");svg.appendChild(p)});
    svg.querySelectorAll("path").forEach(p=>{const L=p.getTotalLength();for(let s=L*.12;s<L;s+=12){const pt=p.getPointAtLength(s);flower(svg,pt.x+(Math.random()-.5)*30,pt.y+(Math.random()-.5)*30)}});
  }
  tree("l");tree("r");

  const cv=document.getElementById("petals"),cx=cv.getContext("2d");let w,h;
  function size(){const d=Math.min(2,devicePixelRatio||1);w=innerWidth;h=innerHeight;cv.width=w*d;cv.height=h*d;cx.setTransform(d,0,0,d,0,0)}
  size();addEventListener("resize",size);
  const mk=init=>({x:Math.random()*w,y:init?Math.random()*h:-20,s:(6+Math.random()*8)*(w<600?.45:1),vy:.5+Math.random()*1,sw:Math.random()*6.28,sp:.01+Math.random()*.02,r:Math.random()*6.28,vr:(Math.random()-.5)*.04,a:.55+Math.random()*.4});
  const ps=Array.from({length:innerWidth<600?26:46},()=>mk(true));
  addEventListener('click',e=>{const t=e.target.closest&&e.target.closest('a,button,summary');if(!t||t.closest('#admin')||ps.length>140)return;const r=t.getBoundingClientRect();for(let i=0;i<14;i++){const p=mk(false);p.b=true;p.x=r.left+r.width/2+(Math.random()-.5)*r.width*.6;p.y=r.top+r.height/2;p.vy=-1.5-Math.random()*3.5;p.sw=Math.random()*6;p.s=(5+Math.random()*6)*(w<600?.5:1);p.a=.95;ps.push(p)}});
  function draw(move){
    cx.clearRect(0,0,w,h);
    ps.forEach(p=>{
      if(move){if(p.b)p.vy+=.045;p.y+=p.vy;p.sw+=p.sp;p.x+=Math.sin(p.sw)*.8+.6;p.r+=p.vr;if(p.y>h+20||p.x>w+30){if(p.b){ps.splice(ps.indexOf(p),1);return}p.y=-20;p.x=Math.random()*w-w*.2}}
      cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.globalAlpha=p.a;cx.fillStyle="#ffffff";
      const s=p.s;cx.beginPath();cx.moveTo(0,-s);cx.bezierCurveTo(s*.95,-s*.6,s*.7,s*.8,0,s);cx.bezierCurveTo(-s*.7,s*.8,-s*.95,-s*.6,0,-s);cx.fill();cx.restore();
    });
    if(move)requestAnimationFrame(()=>draw(true));
  }
  draw(!matchMedia("(prefers-reduced-motion:reduce)").matches);
})();
</script>

<script>
/* ===== STATS ORBIT AROUND THE NAME ===== */
(function(){
  const stage=document.querySelector(".stage"),box=document.getElementById("fls");if(!stage||!box)return;
  const still=matchMedia("(prefers-reduced-motion:reduce)").matches;
  let a0=0,last=performance.now();
  function place(){
    const fl=stage.querySelectorAll(".fl"),n=fl.length;if(!n)return;
    const W=stage.clientWidth,H=stage.clientHeight;
    fl.forEach((el,i)=>{
      const w=el.offsetWidth,h=el.offsetHeight,rx=Math.max(20,W/2-w/2-6),ry=Math.max(20,H/2-h/2-4);
      const a=a0+i*2*Math.PI/n,d=(Math.sin(a)+1)/2;
      el.style.transform="translate(-50%,-50%) translate("+(Math.cos(a)*rx).toFixed(1)+"px,"+(Math.sin(a)*ry).toFixed(1)+"px) scale("+(.82+.26*d).toFixed(3)+")";
      el.style.opacity=(.55+.45*d).toFixed(2);el.style.zIndex=d>.5?2:0;
    });
  }
  function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;a0+=dt*.3;place();requestAnimationFrame(loop)}
  place();addEventListener("resize",place);
  new MutationObserver(place).observe(box,{childList:true});
  if(!still)requestAnimationFrame(loop);
})();
</script>
